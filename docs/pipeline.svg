<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 728" width="980" height="728" role="img" aria-label="SagePTE pipeline: four stages, each with its input, the command to run, and where the output is stored">
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L8 4 L0 8 z" fill="#9aa6b2"/>
    </marker>
    <style>
      .f  { font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif; }
      .m  { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
      .h1 { font-size:20px; font-weight:700; fill:#0f1720; }
      .h2 { font-size:12px; fill:#8a95a1; }
      .chip  { font-size:12.5px; font-weight:600; fill:#0f1720; }
      .chipw { font-size:10px; letter-spacing:.08em; fill:#8a95a1; }
      .st { font-size:14.5px; font-weight:700; fill:#0f1720; letter-spacing:.02em; }
      .lb { font-size:10px; font-weight:700; letter-spacing:.1em; fill:#a9b4bf; }
      .vl { font-size:13px; fill:#26313c; }
      .rn { font-size:13px; font-weight:600; fill:#0b5fa4; }
      .nt { font-size:11.5px; fill:#8a95a1; }
      .bd { font-size:11px; font-weight:700; letter-spacing:.06em; }
      .n  { font-size:11.5px; font-weight:700; fill:#fff; }
    </style>
  </defs>
  <rect width="980" height="728" fill="#fff"/>

  <text class="f h1" x="56" y="46">SagePTE — pipeline</text>
  <text class="f h2" x="56" y="66">Four stages. Each one takes an input, runs one command, and leaves its output in a known place.</text>

  <!-- ─────────── high level ─────────── -->
  <g>
    <rect x="56" y="92" width="186" height="46" rx="6" fill="#f7f9fb" stroke="#e3e8ee"/>
    <text class="f chipw" x="70" y="112">GUEST</text><text class="f chip" x="70" y="129">1 · trace</text>
    <rect x="266" y="92" width="186" height="46" rx="6" fill="#f7f9fb" stroke="#e3e8ee"/>
    <text class="f chipw" x="280" y="112">GUEST</text><text class="f chip" x="280" y="129">2 · guest page table</text>
    <rect x="476" y="92" width="186" height="46" rx="6" fill="#fdf8f1" stroke="#eddcc2"/>
    <text class="f chipw" x="490" y="112" fill="#b98b45">HOST</text><text class="f chip" x="490" y="129">3 · host page table</text>
    <rect x="686" y="92" width="186" height="46" rx="6" fill="#f4faf5" stroke="#d3e7d8"/>
    <text class="f chipw" x="700" y="112" fill="#5d9a6c">EITHER</text><text class="f chip" x="700" y="129">4 · simulate</text>
    <path d="M246 115 L262 115" stroke="#9aa6b2" stroke-width="1.3" marker-end="url(#a)"/>
    <path d="M456 115 L472 115" stroke="#9aa6b2" stroke-width="1.3" marker-end="url(#a)"/>
    <path d="M666 115 L682 115" stroke="#9aa6b2" stroke-width="1.3" marker-end="url(#a)"/>
  </g>

  <!-- ─────────── detail ─────────── -->
  <line x1="70" y1="186" x2="70" y2="580" stroke="#e3e8ee" stroke-width="1.6"/>

  <!-- 1 -->
  <circle cx="70" cy="186" r="12" fill="#16324f"/><text class="f n" x="70" y="190" text-anchor="middle">1</text>
  <text class="f st" x="102" y="191">TRACE</text>
  <rect x="806" y="176" width="68" height="20" rx="10" fill="#eaf2fb"/><text class="f bd" x="840" y="190" text-anchor="middle" fill="#2b5f96">GUEST</text>
  <text class="f lb" x="102" y="218">IN</text> <text class="m vl" x="152" y="218">Workloads/&lt;name&gt;.sh</text>
  <text class="f lb" x="102" y="242">RUN</text><text class="m rn" x="152" y="242">Tracer/run.sh &lt;name&gt;</text>
  <text class="f lb" x="102" y="266">OUT</text><text class="m vl" x="152" y="266">Data/&lt;name&gt;/drmemtrace.dir/</text>
  <text class="f nt" x="440" y="242">pauses here, holding the workload for stage 2</text>

  <!-- 2 -->
  <circle cx="70" cy="308" r="12" fill="#16324f"/><text class="f n" x="70" y="312" text-anchor="middle">2</text>
  <text class="f st" x="102" y="313">GUEST PAGE TABLE</text>
  <rect x="806" y="298" width="68" height="20" rx="10" fill="#eaf2fb"/><text class="f bd" x="840" y="312" text-anchor="middle" fill="#2b5f96">GUEST</text>
  <text class="f lb" x="102" y="340">IN</text> <text class="m vl" x="152" y="340">/proc/page_tables</text>
  <text class="f lb" x="102" y="364">RUN</text><text class="m rn" x="152" y="364">PageTables/Guest/run.sh &lt;name&gt;</text>
  <text class="f lb" x="102" y="388">OUT</text><text class="m vl" x="152" y="388">Data/&lt;name&gt;/pt_dump.guest</text>
  <text class="f nt" x="440" y="340">exists only while the process is alive</text>

  <!-- boundary -->
  <line x1="102" y1="420" x2="362" y2="420" stroke="#dbe2e9" stroke-width="1.4" stroke-dasharray="6 5"/>
  <line x1="626" y1="420" x2="874" y2="420" stroke="#dbe2e9" stroke-width="1.4" stroke-dasharray="6 5"/>
  <text class="m nt" x="494" y="424" text-anchor="middle">scp pt_dump.guest  →  the KVM host</text>

  <!-- 3 -->
  <circle cx="70" cy="462" r="12" fill="#a2691a"/><text class="f n" x="70" y="466" text-anchor="middle">3</text>
  <text class="f st" x="102" y="467">HOST PAGE TABLE</text>
  <rect x="812" y="452" width="62" height="20" rx="10" fill="#fdf3e6"/><text class="f bd" x="843" y="466" text-anchor="middle" fill="#a2691a">HOST</text>
  <text class="f lb" x="102" y="494">IN</text> <text class="m vl" x="152" y="494">pt_dump.guest  ·  the running QEMU process</text>
  <text class="f lb" x="102" y="518">RUN</text><text class="m rn" x="152" y="518">PageTables/Host/run.sh ~/pt_dump.&lt;name&gt;</text>
  <text class="f lb" x="102" y="542">OUT</text><text class="m vl" x="152" y="542">pt_dump.host</text>
  <text class="m nt" x="272" y="542">→ scp back into Data/&lt;name&gt;/</text>

  <!-- 4 -->
  <circle cx="70" cy="580" r="12" fill="#2f6b3c"/><text class="f n" x="70" y="584" text-anchor="middle">4</text>
  <text class="f st" x="102" y="585">SIMULATE</text>
  <rect x="806" y="570" width="68" height="20" rx="10" fill="#f4faf5"/><text class="f bd" x="840" y="584" text-anchor="middle" fill="#2f6b3c">EITHER</text>
  <text class="f lb" x="102" y="612">IN</text> <text class="m vl" x="152" y="612">drmemtrace.dir/  ·  pt_dump.guest  ·  pt_dump.host</text>
  <text class="f lb" x="102" y="636">RUN</text><text class="m rn" x="152" y="636">Simulator/run_arm.sh ../Data/&lt;name&gt;</text>
  <text class="f lb" x="102" y="660">OUT</text><text class="m vl" x="152" y="660">Results/&lt;name&gt;/analysis_arm.txt</text>

  <text class="f nt" x="102" y="698">Optional: <tspan class="m">Tracer/convert_trace.sh &lt;name&gt;</tspan> decodes the trace up front — otherwise stage 4 does it on first run.</text>
</svg>
